<text x="224" y="107" font-family="Arial,Helvetica,sans-serif" font-size="3.1" font-weight="700" fill="#087f80" text-anchor="start">HOST ACTUATION IS OUTSIDE THIS MODULE</text>
<text x="224" y="112.0" font-family="Arial,Helvetica,sans-serif" font-size="2.8" font-weight="400" fill="#52686f" text-anchor="start">Ejectors, air supply, diverters, bins and conveyor drive are not supplied by this concept. Any future command interface needs agreed timing,</text>
<text x="224" y="116.3" font-family="Arial,Helvetica,sans-serif" font-size="2.8" font-weight="400" fill="#52686f" text-anchor="start">fail-safe behavior and a line-level safety review.</text>
<text x="224" y="123.6" font-family="Arial,Helvetica,sans-serif" font-size="3.1" font-weight="700" fill="#087f80" text-anchor="start">ELECTRONIC DESIGN HOLDS</text>
